<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="stylesheet" href="./styles/color.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/font.css" />
    <link rel="stylesheet" href="./styles/dialog.css" />
    <link rel="stylesheet" href="./styles/response.css" />
    <script defer src="./scripts/template.js"></script>
    <script defer src="./script.js"></script>
    <script defer src="./scripts/dialog.js"></script>
  </head>
  <body id="body" onload="init()">
    <header>
      <div>
        <img src="./assets/img/pokeball-icon.png" alt="Pokeball Icon" />
        <h1>Pokedex</h1>
      </div>
      <div>
        <input data-id="search-input" id="searchInputField" oninput="searchByName()" type="text" />
      </div>
    </header>
    <main data-id="content" class="content">
      <div class="galerie" id="galerie"></div>
    </main>
    <button data-id="load-more-button" class="load_more_button" onclick="loadNextPokemons()">
      Load More
    </button>
    <dialog data-id="dialog" onclick="closeDialog()" id="dialog"></dialog>
    <footer>
      <img src="./assets/img/DA-Logo.png" alt="Logo der Developer Akademie" />
    </footer>
  </body>
</html>
