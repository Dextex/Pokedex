<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="stylesheet" href="./styles/color.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/font.css" />
    <script defer src="./script.js"></script>
    <script src="./scripts/dialog.js"></script>
  </head>
  <body onload="init()">
    <header>
      <div>
        <img src="./assets/img/pokeball-icon.png" alt="Pokeball Icon" />
        <h1>Pokedex</h1>
      </div>
      <div><input id="searchInputField" oninput="searchByName()" type="text" /></div>
    </header>
    <main class="content">
      <div class="galerie" id="galerie"></div>
    </main>
    <button onclick="loadNextPokemons()">Next Page</button>
    <dialog open></dialog>
  </body>
</html>
